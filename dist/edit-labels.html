<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kodiak — Edit labels</title><link rel="stylesheet" href="style.css"><style>html,body{height:auto;overflow:auto}body{background:var(--cream);font-family:'Roboto Condensed',sans-serif}main{max-width:760px;padding:36px 24px;margin:auto}h1{font:32px Gin,sans-serif}fieldset{border:1px solid #38231644;margin:20px 0;padding:16px;display:grid;grid-template-columns:100px 1fr;gap:12px}fieldset img{width:90px;height:90px;object-fit:contain;grid-row:span 2}label{display:block}input{display:block;width:100%;padding:8px;font:18px 'Roboto Condensed',sans-serif;color:var(--brown);border:1px solid #38231666;background:white}button,.editor-link{display:inline-block;padding:10px 14px;margin:4px;border:1px solid var(--brown);background:transparent;color:var(--brown);cursor:pointer;font:18px 'Roboto Condensed',sans-serif}#status{min-height:24px}.actions{position:sticky;top:0;background:var(--cream);padding:10px 0;z-index:1}@media(max-width:480px){fieldset{grid-template-columns:64px 1fr}fieldset img{width:60px}}</style></head><body><main><h1>Edit labels</h1><p>Changes preview in this browser only. Download the updated file and replace <code>dist/submissions.js</code> in the project to save them for everyone.</p><div class="actions"><button id="preview">Preview changes</button><button id="download">Download submissions.js</button><a class="editor-link" href="index.html">Canvas</a><a class="editor-link" href="stack.html">Stack</a><button id="reset">Clear browser preview</button></div><p id="status" role="status"></p><form id="labels"></form></main><script src="submissions.js"></script><script src="new-assets.js"></script><script src="contributions.js"></script><script src="catalog.js"></script><script src="edit-labels.js"></script></body></html>
